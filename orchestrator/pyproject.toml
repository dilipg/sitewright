[project]
name = "orchestrator"
version = "0.0.0"
description = "Agent pipeline orchestrator (Kitaru-instrumented, built starting in milestone 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120.0",
    "google-genai>=2.14.0",
    "kitaru>=0.21.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
