name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs uv; Python 3.12 is auto-fetched from orchestrator/.python-version
      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      # Fixture is a standalone project (not a workspace); the preview
      # server and export verification build resolve its dependencies.
      - run: npm ci
        working-directory: fixtures/acme-landing

      - run: npx playwright install --with-deps chromium

      - run: npm run check
