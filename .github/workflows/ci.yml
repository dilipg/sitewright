name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs uv; Python 3.12 is auto-fetched from orchestrator/.python-version
      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      - run: npm run check
