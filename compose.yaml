# Run the whole stack with `docker compose up`.
#
# Two services, ONE image. They are two processes rather than one because that is
# what the architecture already is: `server/` is the authenticated composition
# root on 4000, and the editor is served by its own Vite dev server on 5173 whose
# proxy forwards `/api`, `/__*` and `/preview` to the server so the browser only
# ever sees one origin (cookies flow, SameSite=Lax survives, no CORS, and slice
# 2's CSRF posture is untouched).
#
# THE PREVIEW CHILDREN GET NO PORT. `server/src/preview-pool.ts` spawns one Vite
# child process per open project INSIDE the server container and reverse-proxies
# it at `/preview/<projectId>/*` behind `requireProject`. Publishing a port for
# them would not just be unnecessary, it would route around that authorization.

x-webgen-image: &webgen-image
  build:
    context: .
    dockerfile: Dockerfile
  # Named so both services resolve the SAME built image and the second build is a
  # pure cache hit rather than a second install of everything.
  image: website-generator:local

x-webgen-volumes: &webgen-volumes
  # The repo itself, so the code running is the code the tester cloned and a
  # `git pull` takes effect without a rebuild. It also carries the two things
  # that must survive a container: `generated/` (382MB of prior runs on the
  # machine this was written on) and `server/data/` (accounts, argon2 hashes,
  # live sessions, encrypted API keys). Both stay ordinary host directories —
  # visible, backup-able with a file copy, shared with the from-source path, and
  # crucially NOT destroyed by `docker compose down -v`.
  #
  # SQLite's WAL mode was the risk here and it was measured, not assumed: the
  # server and `scripts/user.ts` are two processes on one file, and a filesystem
  # without mmap support degrades or fails WAL outright. Verified on this
  # machine's Docker Desktop bind mount — `journal_mode=wal` in both processes
  # and a cross-process write read back correctly.
  - .:/app

  # SECRETS THE BIND MOUNT WOULD OTHERWISE HAND TO MODEL-GENERATED CODE.
  #
  # `serve.ts:109` deletes `WEBGEN_MASTER_KEY` from `process.env` the moment it
  # is read, precisely because `compiler/`'s spawn sites pass no `env` and would
  # inherit it into a generated project's own `vite.config.ts` — which is
  # model-authored from a free-text brief and then EXECUTED by Vite. The mount
  # above defeats that entirely: the same value sits at `/app/.env.docker` where
  # any generated file can simply read it. Found by the whole-branch review.
  #
  # `orchestrator/.env` is worse and the review did not name it: it holds the
  # OPERATOR's real ANTHROPIC_API_KEY and GEMINI_API_KEY. Shadowing it also
  # closes the fall-through that has produced the "operator pays" bug twice —
  # python-dotenv's `override=False` means an absent injected key silently
  # reaches for this file, so under Docker a user's run could bill the operator.
  # Nothing in the container needs it: `agent-env.ts` injects the user's own key
  # from the database, and compose reads `.env.docker` HOST-side for `env_file`,
  # never from inside the container.
  #
  # `/dev/null` rather than a tmpfs or an anonymous volume because both of those
  # mount a DIRECTORY, and these two paths are files.
  - /dev/null:/app/.env.docker:ro
  - /dev/null:/app/orchestrator/.env:ro

  # NAMED VOLUMES OVER EVERY node_modules — the Windows/macOS trap the bind
  # mount above would otherwise walk straight into. The host tree holds
  # win32/darwin native binaries (@node-rs/argon2, esbuild, rolldown,
  # lightningcss); mounting it over the image's linux-x64 install replaces every
  # one of them with a binary this container cannot load. A volume is
  # initialised from the IMAGE's directory contents when it is EMPTY, so each of
  # these keeps the tree `npm ci` built during the build.
  #
  # NAMED, NOT ANONYMOUS, and that one word was worth ~50 minutes of a tester's
  # evening. Measured on this machine, image already built, `up -d` wall clock:
  #
  #                        anonymous          named
  #   first `up`           61.1s              13.4s
  #   every `up` after     27.1s              12.2–12.9s (5 cycles)
  #   volumes per `up`     10 (5 per svc)     5, created once and reused
  #   bytes copied         478 MB every up    239 MB, once
  #   orphans per cycle    +10                0
  #
  # (13.4s is with the volumes already filled; from zero volumes it is 22.2s,
  # and that one includes `--wait` blocking until BOTH services report healthy,
  # which the anonymous numbers above do not.)
  #
  # Anonymous volumes are per-container and are NEVER reused across a
  # `down`/`up`: each `up` created five fresh ones per service and copied
  # node_modules into every one of them, and a plain `docker compose down`
  # (which does not take `-v`) left all ten behind as dangling volumes nothing
  # could name again. A dogfood run accumulated 92 of them, 3.39 GB. Worse, the
  # copy happens during the phase compose prints as `Container … Creating` and
  # then says nothing more about, and the SECOND container's five were measured
  # at 48.1s and 12.8s against 5.8s for the first container's (why the second set
  # costs so much more was not established — writeback contention is the guess,
  # and sharing removes it rather than explaining it). Compose prints one line
  # and then goes quiet for that whole time, which is indistinguishable from a
  # hang, and was reported as one.
  #
  # Named volumes fix all three: they survive a plain `down` so the copy is paid
  # ONCE, they carry compose's own project labels so `down -v` removes exactly
  # these five and `docker volume ls --filter
  # label=com.docker.compose.project=websitegenerator` can enumerate them (an
  # anonymous volume carries only `com.docker.volume.anonymous=`, so there is no
  # way to target this project's — the only command that reaches them is
  # `docker volume prune`, which takes every OTHER project's anonymous volumes
  # with it), and nothing accumulates.
  #
  # SHARED between the two services on purpose. Both run the SAME image and need
  # the identical linux-x64 tree, and they already share every other file in
  # /app through the bind mount above — the per-container isolation anonymous
  # volumes gave was incidental, never a designed property. Sharing halves both
  # the first-start copy and the disk. Only the editor writes into any of these
  # (Vite's dep cache at editor/node_modules/.vite) and only the editor runs
  # that Vite; the preview children the SERVER spawns run Vite against
  # generated/<runId>, in the bind mount.
  #
  # Consequence worth knowing, unchanged: a volume is initialised from the image
  # only while it is empty, so after changing a dependency the refresh is
  # `docker compose down -v && docker compose up --build` — safe here precisely
  # because `generated/` and the database are bind mounts, not volumes, so `-v`
  # cannot touch them.
  #
  # compiler/node_modules and editor/node_modules are EMPTY in the image (0
  # entries; npm workspaces hoists everything to the root) and are still mounted
  # deliberately: the job is to shadow whatever the HOST has at that path, and a
  # host install can legitimately place a win32 native binary there when a
  # version conflict defeats hoisting. An empty volume costs nothing.
  - root_node_modules:/app/node_modules
  - compiler_node_modules:/app/compiler/node_modules
  - editor_node_modules:/app/editor/node_modules
  - server_node_modules:/app/server/node_modules
  - fixture_node_modules:/app/fixtures/acme-landing/node_modules
  # orchestrator's venv needs no entry here: the Dockerfile sets
  # UV_PROJECT_ENVIRONMENT=/opt/venv, outside /app entirely, so the host's
  # Windows `.venv` is never consulted.

services:
  server:
    <<: *webgen-image
    working_dir: /app/server # so `docker compose exec server node scripts/user.ts …` lands here
    command: ["server"]
    env_file:
      # `required: false` on purpose: a missing file must produce the
      # entrypoint's own explanation of where WEBGEN_MASTER_KEY comes from and
      # why it must be generated exactly once, not compose's "env file not
      # found".
      - path: .env.docker
        required: false
    environment:
      # Drops the Secure flag from the session cookie. Correct for plain HTTP;
      # never set on a real deployment.
      INSECURE_COOKIES: "1"
      # Docker IS the supervisor here, and `serve.ts` asks to be told its grace
      # rather than guess: every shutdown deadline (proxied-job wait < preview
      # watchdog < grace) derives from this one number. Kept equal to
      # stop_grace_period below so the two cannot drift.
      WEBGEN_SHUTDOWN_GRACE_MS: "30000"
      # NOT SET, deliberately. `fanout.py` now defaults to SERIAL (1 worker),
      # and this file used to set 2 to avoid an OOM. That setting turned out to
      # cause something worse: measured here, two workers 424 ms apart raced
      # Kitaru's SQLite metadata store (journal_mode=delete, busy_timeout=5000),
      # a `commit_section_manifest` was lost, and the run shipped a section's
      # .tsx with no manifest entry — gate 4 rejects that forever, so the site
      # looked finished in the canvas and could never be exported.
      # Raise WEBGEN_FANOUT_MAX_WORKERS here only if you accept that race
      # (docs/pending.md K1 tracks making the store WAL, which would let
      # parallelism return safely).
      #
      # Optional. Set it to your account's address to have existing directories
      # in `generated/` adopted on boot so they appear in the picker. It cannot
      # create a user: an address matching no account is a logged skip.
      WEBGEN_BOOTSTRAP_EMAIL: "${WEBGEN_BOOTSTRAP_EMAIL:-}"
    volumes: *webgen-volumes
    ports:
      # 127.0.0.1, not 0.0.0.0: this is a single-user local tool with a session
      # cookie carrying no Secure flag. Binding it to every interface would put
      # it on the tester's LAN.
      - "127.0.0.1:4000:4000"
    stop_grace_period: 30s
    healthcheck:
      # /api/me unauthenticated answers 401, which proves the route table is
      # live rather than merely that a socket is open. `node -e` because the
      # slim image has no curl and adding one to buy a healthcheck is not worth
      # a layer.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  editor:
    <<: *webgen-image
    working_dir: /app
    command: ["editor"]
    environment:
      # Inside the editor container `localhost` is the EDITOR, not the server, so
      # vite.config.ts's default of http://localhost:4000 would proxy to nothing.
      # That file already reads this variable, so this is configuration rather
      # than a code change.
      WEBGEN_HOSTED_SERVER_URL: "http://server:4000"
    volumes: *webgen-volumes
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Nothing depends on this one, so it gates nothing. It exists so that
      # "is it up yet?" has an answer a tester can read — `docker compose ps`
      # shows `healthy` on both rows, and `docker compose up --wait` returns
      # only when the editor is genuinely serving rather than merely started.
      # Vite answers `/` with the index HTML; a 200 means the dev server has
      # finished booting, which is several seconds after `Started`.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

# Declared so they are NAMED (see the volume list above): compose creates them as
# `websitegenerator_<name>`, labels them with this project, reuses them across a
# plain `down`/`up`, and removes exactly these five — and nothing else on the
# machine — on `docker compose down -v`.
volumes:
  root_node_modules:
  compiler_node_modules:
  editor_node_modules:
  server_node_modules:
  fixture_node_modules:
